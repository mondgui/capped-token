<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capped token</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Literata:opsz,wght@7..72,560&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="page">
      <p class="eyebrow">Local chain · click to run</p>
      <h1>Capped token</h1>
      <p class="lede">
        Portfolio Token has a hard cap of 1,000,000. Only the owner can create new tokens.
        The holder can destroy tokens they already have.
      </p>
      <p id="status" class="lede">Reading the local chain…</p>
      <section class="cards">
        <article>
          <p class="label">Supply</p>
          <p id="supply" class="amount">—</p>
        </article>
        <article>
          <p class="label">Cap</p>
          <p id="cap" class="amount">—</p>
        </article>
        <article>
          <p class="label">Holder balance</p>
          <p id="holder" class="amount">—</p>
        </article>
      </section>
      <div class="actions">
        <button id="mint" type="button">Owner mints 100</button>
        <button id="burn" type="button">Holder burns 40</button>
        <button id="stranger" class="secondary" type="button">Holder tries to mint</button>
        <button id="over" class="secondary" type="button">Owner tries to pass the cap</button>
      </div>
      <p id="note" class="note"></p>
      <footer>
        Also open the
        <a href="http://localhost:5175">staking vault</a>
        and the
        <a href="http://localhost:5176">mini exchange</a>.
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
